# This GitHub Workflow YAML file is generated using GLM 5.1 and DeepSeek V4 Pro.

name: CMake on multiple platforms

on:
  push:
    branches: [ "mvp" ]
  pull_request:
    branches: [ "mvp" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            c_compiler: gcc
            cpp_compiler: g++
        exclude:
          - os: windows-latest
            c_compiler: clang

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2 for Windows
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          git
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build (Linux)
      if: runner.os == 'Linux'
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Upload artifact (Linux)
      if: runner.os == 'Linux'
      run: |
        cp "${{ steps.strings.outputs.build-output-dir }}/libcbcparser.so" "libcbcparser-linux-${{ matrix.c_compiler }}.so"
    - uses: actions/upload-artifact@v4
      if: runner.os == 'Linux'
      with:
        name: cbcparser-linux-${{ matrix.c_compiler }}
        path: libcbcparser-linux-${{ matrix.c_compiler }}.so

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        cmake -B build \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -G Ninja \
          -S .

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        cp build/libcbcparser.dll "libcbcparser-windows-${{ matrix.c_compiler }}.dll"
    - uses: actions/upload-artifact@v4
      if: runner.os == 'Windows'
      with:
        name: cbcparser-windows-${{ matrix.c_compiler }}
        path: libcbcparser-windows-${{ matrix.c_compiler }}.dll

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          name: Latest Build (mvp)
          tag_name: latest
          prerelease: true
          files: artifacts/*
          body: |
            Automated build from `mvp` branch.

            | Platform | Compiler | Artifact |
            |----------|----------|----------|
            | Linux x86_64 | gcc | `libcbcparser.so` |
            | Linux x86_64 | clang | `libcbcparser.so` |
            | Windows x86_64 | gcc (UCRT64) | `libcbcparser.dll` |